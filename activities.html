<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14243b"><title>فعالیت‌ها | مسجد امام رضا (ع)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/activities.css"></head><body><div class="app-container activities-app">
<header class="app-header"><a href="index.html" class="header-back">←</a><div class="header-brand"><div><strong>مسجد امام رضا (ع)</strong><small>حلقه شهید هادی ذوالفقاری</small></div></div></header>
<main class="page activities-page"><div class="activities-intro"><div><span>ARCHIVE</span><h1>فعالیت‌ها</h1><p>رویدادها و برنامه‌های ثبت‌شده حلقه</p></div><div class="archive-count" id="activityCount">۰</div></div>
<div id="activityList" class="activity-grid"><div class="activity-skeleton"></div><div class="activity-skeleton"></div></div></main><nav class="bottom-nav"></nav></div><script src="js/main.js" defer></script><script>
(function(){'use strict';function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function render(list){var el=document.getElementById('activityList'),count=document.getElementById('activityCount');if(count)count.textContent=Number(list.length).toLocaleString('fa-IR');if(!list.length){el.innerHTML='<div class="activities-empty"><strong>هنوز فعالیتی ثبت نشده</strong><span>وقتی فعالیتی اضافه شود اینجا نمایش داده می‌شود</span></div>';return}el.innerHTML=list.map(function(e){return '<article class="activity-v5"><div class="activity-image"><img src="'+esc(e.imageUrl||'images/placeholder.svg')+'" alt="'+esc(e.title)+'" loading="lazy"><span>'+esc(e.label||'فعالیت')+'</span></div><div class="activity-body"><h2>'+esc(e.title)+'</h2><p>'+esc(e.description||e.date||'')+'</p><div class="activity-foot"><time>'+esc(e.date||'')+'</time><b>جزئیات ←</b></div></div></article>'}).join('')}function load(){if(!window.KanoonApp)return;window.KanoonApp.api.get({action:'listActivities'}).then(function(r){render(r.items||[])}).catch(function(){render([])})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load()})();
</script></body></html>
