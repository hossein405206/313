<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ===== متغیرها ===== */
:root {
--bg-cream: #F6EFE1;
--teal-primary: #146B66;
--teal-dark: #0D4F4B;
--gold-ochre: #C79B3B;
--navy-dark: #223A5E;
--text-dark: #2B2620;
--white: #FFFFFF;

--header-h: 65px;
--nav-h: 65px;
--header-border: 3px;
--nav-border: 2px;
--shell-max: 480px;
}

/* ===== ریست ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
background-color: #121212;
color: var(--text-dark);
font-family: 'Vazirmatn', system-ui, sans-serif;
display: flex;
justify-content: center;
min-height: 100vh;
min-height: 100dvh;
line-height: 1.5;
}

img { display: block; max-width: 100%; }

button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }

/* ===== پوسته موبایل ===== */
.app-container {
width: 100%;
max-width: var(--shell-max);
background-color: var(--bg-cream);
min-height: 100vh;
min-height: 100dvh;
position: relative;
padding-top: calc(var(--header-h) + var(--header-border) + 10px);
padding-bottom: calc(var(--nav-h) + var(--nav-border) + 20px);
box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
display: flex;
flex-direction: column;
}

/* ===== هدر ===== */
.app-header {
position: fixed;
top: 0;
left: 50%;
transform: translateX(-50%);
width: 100%;
max-width: var(--shell-max);
height: var(--header-h);
background-color: var(--teal-primary);
color: var(--bg-cream);
display: flex;
align-items: center;
justify-content: center;
box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
z-index: 1000;
border-bottom: var(--header-border) solid var(--gold-ochre);
padding: 0 12px;
}

.app-header h1 {
font-family: 'Aref Ruqaa', serif;
font-size: clamp(1.05rem, 4.5vw, 1.45rem);
font-weight: 700;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
text-align: center;
}

/* ===== کاروسل ===== */
.carousel-section { padding: 15px; }

.carousel-container {
position: relative;
width: 100%;
height: 195px;
background: var(--white);
border-radius: 18px;
overflow: hidden;
border: 2px solid var(--teal-primary);
box-shadow: 0 4px 12px rgba(20, 107, 102, 0.12);
}

.carousel-slide {
position: absolute;
inset: 0;
opacity: 0;
visibility: hidden;
transition: opacity 0.4s ease, visibility 0.4s;
}

.carousel-slide.active {
opacity: 1;
visibility: visible;
}

.carousel-slide img {
width: 100%;
height: 100%;
object-fit: cover;
}

.carousel-overlay {
position: absolute;
bottom: 0;
left: 0;
right: 0;
background: linear-gradient(transparent, rgba(13, 79, 75, 0.92));
color: var(--bg-cream);
padding: 12px 15px 22px;
}

.carousel-overlay h3 {
font-size: 1rem;
font-weight: 700;
margin-bottom: 2px;
}

.carousel-overlay p {
font-size: 0.8rem;
opacity: 0.9;
}

.carousel-dots {
position: absolute;
bottom: 8px;
left: 50%;
transform: translateX(-50%);
display: flex;
gap: 6px;
z-index: 10;
}

.dot {
width: 8px;
height: 8px;
padding: 0;
background-color: rgba(255, 255, 255, 0.55);
border-radius: 50%;
transition: all 0.3s ease;
border: none;
}

.dot:focus-visible {
outline: 2px solid var(--gold-ochre);
outline-offset: 3px;
}

.dot.active {
background-color: var(--gold-ochre);
width: 20px;
border-radius: 4px;
}

/* ===== شبکه منو ===== */
.menu-grid-section { padding: 10px 15px 20px; }

.section-title {
font-size: 1.1rem;
font-weight: 700;
color: var(--teal-dark);
margin-bottom: 14px;
display: flex;
align-items: center;
gap: 8px;
}

.section-title::before {
content: '';
display: inline-block;
width: 4px;
height: 18px;
background-color: var(--gold-ochre);
border-radius: 2px;
}

.menu-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 14px;
}

.menu-card {
background-color: var(--white);
border: 2px solid var(--teal-primary);
border-radius: 24px 24px 8px 8px;
padding: 16px 10px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-decoration: none;
color: var(--text-dark);
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
transition: transform 0.2s ease, background-color 0.2s ease;
-webkit-tap-highlight-color: transparent;
}

.menu-card:active {
transform: scale(0.97);
background-color: #EFE6D5;
}

.menu-card:focus-visible {
outline: 2px solid var(--gold-ochre);
outline-offset: 2px;
}

.icon-wrapper {
width: 52px;
height: 52px;
background-color: rgba(20, 107, 102, 0.1);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 10px;
}

.menu-card svg {
width: 28px;
height: 28px;
stroke: var(--teal-primary);
fill: none;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
}

.menu-card span {
font-size: 0.92rem;
font-weight: 700;
color: var(--teal-dark);
text-align: center;
}

/* ===== نوار پایین ===== */
.bottom-nav {
position: fixed;
bottom: 0;
left: 50%;
transform: translateX(-50%);
width: 100%;
max-width: var(--shell-max);
height: var(--nav-h);
background-color: var(--navy-dark);
display: flex;
justify-content: space-around;
align-items: center;
z-index: 1000;
border-top: var(--nav-border) solid var(--gold-ochre);
padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-decoration: none;
color: #A0AEC0;
font-size: 0.75rem;
font-weight: 600;
gap: 4px;
transition: color 0.2s;
width: 33.33%;
height: 100%;
background: none;
border: none;
}

.nav-item svg {
width: 22px;
height: 22px;
stroke: #A0AEC0;
fill: none;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
transition: stroke 0.2s;
}

.nav-item.active,
.nav-item.active svg { color: var(--gold-ochre); }
.nav-item.active svg { stroke: var(--gold-ochre); }

.nav-item:focus-visible {
outline: 2px solid var(--gold-ochre);
outline-offset: -4px;
}

/* ===== مدال ===== */
.modal {
position: fixed;
inset: 0;
background: rgba(0, 0, 0, 0.6);
z-index: 2000;
display: flex;
align-items: center;
justify-content: center;
padding: 16px;
opacity: 0;
visibility: hidden;
transition: opacity 0.25s ease, visibility 0.25s ease;
}

.modal.active {
opacity: 1;
visibility: visible;
}

.modal-content {
background: var(--bg-cream);
width: 100%;
max-width: 400px;
border-radius: 20px;
padding: 20px;
border: 2px solid var(--teal-primary);
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
transform: translateY(10px) scale(0.98);
transition: transform 0.25s ease;
}

.modal.active .modal-content {
transform: translateY(0) scale(1);
}

.modal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
border-bottom: 1px solid #E2D7C3;
padding-bottom: 10px;
}

.modal-header h3 {
color: var(--teal-dark);
font-size: 1.1rem;
}

.close-btn {
font-size: 1.5rem;
line-height: 1;
color: var(--text-dark);
padding: 4px 8px;
border-radius: 6px;
}

.close-btn:hover { background: rgba(0, 0, 0, 0.05); }
.close-btn:focus-visible { outline: 2px solid var(--gold-ochre); }

.form-group { margin-bottom: 15px; }

.form-group label {
display: block;
margin-bottom: 6px;
font-size: 0.85rem;
font-weight: 600;
}

.form-control {
width: 100%;
padding: 10px 12px;
border: 1px solid #CBD5E0;
border-radius: 10px;
font-size: 0.95rem;
outline: none;
font-family: inherit;
background: #fff;
}

.form-control:focus {
border-color: var(--teal-primary);

.btn-submit {

padding: 12px;

color: var(--bg-cream);

.btn-submit:hover { background-color: var(--teal-dark); }
.btn-submit:focus-visible { outline: 2px solid var(--gold-ochre); outline-offset: 2px; }

/* ===== کاهش انیمیشن ===== */
@media (prefers-reduced-motion: reduce) {
*, *::before, *::after {
animation-duration: 0.01ms !important;
transition-duration: 0.01ms !important;
}
}
</style>
</head>

<script src="js/main.js" defer></script>
<script>
(() => {
'use strict';

/* ============ کاروسل ============ */
const slides = Array.from(document.querySelectorAll('.carousel-slide'));
const dots = Array.from(document.querySelectorAll('.dot'));
const container = document.getElementById('carouselContainer');
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let currentSlide = 0;
let timerId = null;

function setSlide(index) {
if (index < 0 || index >= slides.length) return;
slides.forEach((s, i) => {
const on = i === index;
s.classList.toggle('active', on);
s.setAttribute('aria-hidden', String(!on));
});
dots.forEach((d, i) => {
const on = i === index;
d.classList.toggle('active', on);
d.setAttribute('aria-selected', String(on));
});
currentSlide = index;
}

function nextSlide() {
setSlide((currentSlide + 1) % slides.length);
}

function startCarousel() {
if (prefersReduced || slides.length < 2) return;
stopCarousel();
timerId = window.setInterval(nextSlide, 4000);
}

function stopCarousel() {
if (timerId !== null) {
clearInterval(timerId);
timerId = null;
}
}

// دات‌ها
dots.forEach(dot => {
dot.addEventListener('click', () => {
setSlide(Number(dot.dataset.index));
startCarousel(); // ریست تایمر
});
});

// توقف روی هاور / فوکوس
container.addEventListener('mouseenter', stopCarousel);
container.addEventListener('mouseleave', startCarousel);
container.addEventListener('focusin', stopCarousel);
container.addEventListener('focusout', startCarousel);

// توقف وقتی تب مخفی است
document.addEventListener('visibilitychange', () => {
document.hidden ? stopCarousel() : startCarousel();
});

// swipe ساده
let touchStartX = 0;
container.addEventListener('touchstart', e => {
touchStartX = e.changedTouches[0].clientX;
stopCarousel();
}, { passive: true });

container.addEventListener('touchend', e => {
const dx = e.changedTouches[0].clientX - touchStartX;
if (Math.abs(dx) > 40) {
const dir = dx < 0 ? 1 : -1; // RTL: کشیدن به چپ = بعدی
setSlide((currentSlide + dir + slides.length) % slides.length);
}
startCarousel();
}, { passive: true });

// شروع
setSlide(0);
startCarousel();

/* ============ مدال ورود ============ */
const modal = document.getElementById('loginModal');
const openBtn = document.getElementById('openLoginBtn');
const phoneInput = document.getElementById('phoneInput');
const form = document.getElementById('mentorLoginForm');
let lastFocused = null;

function openLoginModal() {
lastFocused = document.activeElement;
modal.classList.add('active');
document.body.style.overflow = 'hidden';
// فوکوس بعد از انیمیشن
requestAnimationFrame(() => phoneInput.focus());
}

function closeLoginModal() {
modal.classList.remove('active');
document.body.style.overflow = '';
if (lastFocused && typeof lastFocused.focus === 'function') {
lastFocused.focus();
}
}

openBtn.addEventListener('click', openLoginModal);

modal.addEventListener('click', e => {
if (e.target === modal || e.target.hasAttribute('data-close')) {
closeLoginModal();
}
});

document.addEventListener('keydown', e => {
if (e.key === 'Escape' && modal.classList.contains('active')) {
closeLoginModal();
}
});

// قفل فوکوس داخل مدال (focus trap ساده)
modal.addEventListener('keydown', e => {
if (e.key !== 'Tab') return;
const focusables = modal.querySelectorAll(
'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
);
if (!focusables.length) return;
const first = focusables[0];
const last = focusables[focusables.length - 1];
if (e.shiftKey && document.activeElement === first) {
e.preventDefault();
last.focus();
} else if (!e.shiftKey && document.activeElement === last) {
e.preventDefault();
first.focus();
}
});

/* ============ ارسال فرم ============ */
form.addEventListener('submit', async e => {
e.preventDefault();

const phone = phoneInput.value.trim();
if (!/^09\d{9}$/.test(phone)) {
phoneInput.focus();
phoneInput.setCustomValidity('شماره باید با ۰۹ شروع شده و ۱۱ رقم باشد');
phoneInput.reportValidity();
phoneInput.setCustomValidity('');
return;
}

try {
if (typeof window.checkMentorLogin === 'function') {
await window.checkMentorLogin(phone);
closeLoginModal();
} else {
console.warn('checkMentorLogin در main.js یافت نشد.');
}
} catch (err) {
console.error('خطا در ورود مربی:', err);
}
});
})();
</script>
