<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حلقه شهید هادی ذوالفقاری</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
<div class="shell">

  <header class="site-header">
    <button class="icon-btn" aria-label="منو">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <h1 class="site-title">حلقه شهید هادی ذوالفقاری</h1>
    <button class="icon-btn" data-open-login aria-label="ورود مربیان">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    </button>
  </header>

  <section class="hero">
    <div class="carousel">
      <div class="carousel-track"></div>
    </div>
    <div class="carousel-dots"></div>
  </section>

  <div class="menu-grid">
    <a class="menu-tile" href="activities.html">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>فعالیت‌ها</span>
    </a>
    <a class="menu-tile" href="register.html">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21v-2a4 4 0 0 1 4-4h3"/><circle cx="9" cy="7" r="3.5"/><path d="M16 11l5 5-2 2-5-5"/><path d="M13.5 13.5l-2 2 1.5 1.5 2-2"/></svg>
      <span>ثبت‌نام اردو</span>
    </a>
    <a class="menu-tile" href="schedule.html">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="16" y1="14" x2="16" y2="14.01"/></svg>
      <span>برنامه‌ی هفتگی</span>
    </a>
    <a class="menu-tile" href="officials.html">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15 20a4.2 4.2 0 0 1 7.5-2.6"/></svg>
      <span>مسئولین</span>
    </a>
    <a class="menu-tile" href="feedback.html">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5A8.5 8.5 0 1 1 21 11.5z"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="13" y2="14"/></svg>
      <span>پیشنهاد و انتقاد</span>
    </a>
    <a class="menu-tile" href="contact.html">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5c0 8.5 6.5 15 15 15l2-4-6-2-1.5 2A13 13 0 0 1 6.5 9L8.5 7.5l-2-6z"/></svg>
      <span>ارتباط با ما</span>
    </a>
  </div>

  <div class="section-heading">
    <h3>رویدادهای اخیر</h3>
    <span class="see-all">مشاهده همه</span>
  </div>

  <div class="activity-list" id="homeUpcoming"></div>

  <nav class="bottom-nav">
    <a href="index.html" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      خانه
    </a>
    <a href="activities.html" data-page="activities">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      فعالیت‌ها
    </a>
    <button data-open-login>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      ورود مربیان
    </button>
  </nav>

</div>

<!-- مودال ورود مربیان -->
<div class="modal-overlay">
  <div class="modal-sheet">
    <button class="modal-close" data-close-login>بستن</button>
    <h3>ورود مربیان</h3>
    <p class="hint">شماره همراه خود را وارد کنید. فقط شماره‌های از پیش ثبت‌شده اجازه‌ی ورود دارند.</p>
    <form>
      <div class="field">
        <label for="mentorPhone">شماره همراه</label>
        <input id="mentorPhone" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" required />
      </div>
      <button type="submit" class="btn-primary">ورود</button>
    </form>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  // نمایش دو رویداد نزدیک زیر منو در صفحه‌ی خانه
  document.addEventListener("DOMContentLoaded", () => {
    const wrap = document.getElementById("homeUpcoming");
    SAMPLE_EVENTS.slice(0, 2).forEach((ev) => {
      const card = document.createElement("div");
      card.className = "activity-card";
      card.innerHTML = `
        <div class="activity-date"><span class="day">•</span><span class="month">${ev.date}</span></div>
        <div class="activity-body"><h4>${ev.title}</h4><p>${ev.tag}</p></div>`;
      wrap.appendChild(card);
    });
  });
</script>
</body>
</html>
