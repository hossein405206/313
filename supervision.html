<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F6B62">
  <title>نظارت | کانون</title>

  <link rel="stylesheet" href="css/style.css?v=5.79.0">
  <link rel="stylesheet" href="css/supervision.css?v=5.79.0">
  <link rel="stylesheet" href="css/islamic-design.css?v=5.79.0">
</head>
<body>

  <div class="app-container">

    <header class="app-header">
      <a href="officials.html" class="header-back" aria-label="بازگشت">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>
      <h1>پنل نظارت</h1>
    </header>

    <main class="page">

      <!-- ═══ خلاصه ═══ -->
      <section class="sup-summary">
        <div class="sup-summary__box">
          <span class="sup-summary__label">تاریخ</span>
          <strong id="sessionDate">—</strong>
        </div>
        <div class="sup-summary__box">
          <span class="sup-summary__label">مسئول نظارت</span>
          <strong id="officialName">—</strong>
        </div>
        <div class="sup-summary__box sup-summary__box--count">
          <span class="sup-summary__label">اخطارهای امروز</span>
          <strong id="todayWarnings">۰</strong>
        </div>
      </section>

      <!-- ═══ فرم ثبت اخطار ═══ -->
      <section class="sup-form-card">
        <h2 class="section-title">ثبت اخطار جدید</h2>

        <form id="warningForm" novalidate>
<div class="form-group"><label for="responsibilityInput">مسئولیت</label><select id="responsibilityInput" class="form-control" required><option value="">انتخاب مسئولیت</option><option>مسئول PS5</option><option>مسئول سیستم صوتی</option><option>مسئول خرید</option><option>مسئول مسجد</option><option>مسئول کانون</option><option>مسئول هیئت</option><option>مسئول مکبری</option><option>مسئول آشپزخانه</option><option>مسئول تدارکات</option><option>مسئول هماهنگی</option><option>مسئول رسانه</option><option>مسئول اتاق رسانه</option><option>مسئول ورزش</option><option>مسئول VR</option><option>مسئول عکاسی</option><option>مسئول حضور و غیاب</option></select></div>
<div class="form-group"><label for="warningText">دلیل اخطار</label><textarea id="warningText" class="form-control" placeholder="دلیل اخطار را دقیق بنویس" maxlength="300" required></textarea><small class="sup-char-count"><span id="charCount">۰</span> / ۳۰۰</small></div>
<button type="submit" class="btn-submit" id="submitWarning">ثبت اخطار</button></form>
      </section>

      <!-- ═══ لیست اخطارها ═══ -->
      <section class="sup-history">
        <h2 class="section-title">
          اخطارهای اخیر
          <small class="section-count" id="warningCount">۰</small>
        </h2>

        <div class="chips" role="tablist" aria-label="فیلتر اخطارها">
          <button class="chip active" data-filter="all" role="tab">همه</button>
          <button class="chip" data-filter="today" role="tab">امروز</button>
          <button class="chip" data-filter="week" role="tab">این هفته</button>
        </div>

        <div class="sup-list" id="warningsList">
          <div class="att-loading">
            <div class="spinner"></div>
            <span>در حال بارگذاری...</span>
          </div>
        </div>

        <div class="empty hidden" id="warningsEmpty">
          <p>اخطاری ثبت نشده</p>
        </div>
      </section>

    </main>

    <nav class="bottom-nav"></nav>
  </div>

  <script src="js/main.js?v=5.79.0" defer></script>
  <script src="js/supervision.js?v=5.79.0" defer></script>
</body>
</html>
