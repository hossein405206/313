<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14243b"><title>ورود اعضا | مسجد امام رضا (ع)</title><link rel="stylesheet" href="css/style.css?v=5.53.0"><link rel="stylesheet" href="css/auth.css?v=5.53.0">  <link rel="stylesheet" href="css/islamic-design.css?v=5.62.0">
</head><body><div class="app-container">
<header class="app-header"><a href="index.html" class="header-back">←</a><div class="header-brand"><div><strong>مسجد امام رضا (ع)</strong><small>حلقه شهید هادی ذوالفقاری</small></div></div></header>
<main class="page auth-page">
<section class="ali-wisdom" aria-label="کلامی از امام علی علیه السلام">
  <div class="ali-wisdom__ornament">◈ کلام معصوم ◈</div>
  <div class="ali-wisdom__arabic" id="aliWisdomArabic" aria-live="polite"></div>
  <div class="ali-wisdom__meaning"><b>✍️ معنی:</b> <span id="aliWisdomMeaning"></span></div>
  <div class="ali-wisdom__source">📌 منبع: <span id="aliWisdomSource"></span></div>
</section>
<section class="auth-step active" data-step="1">
<div class="auth-hero"><div class="auth-hero__icon"><span>ح</span></div><h2 class="auth-title">ورود یا ثبت‌نام</h2><p class="auth-subtitle">برای ساخت حساب، نام، شماره همراه و گذرواژه را وارد کن.</p></div>
<form id="memberForm" class="auth-form" novalidate>
<div class="form-group"><label for="nameInput">نام و نام خانوادگی <span class="auth-optional">(برای حساب جدید)</span></label><input type="text" id="nameInput" class="form-control" placeholder="مثلاً حسین محمدی" autocomplete="name"></div>
<div class="form-group"><label for="phoneInput">شماره همراه</label><input type="tel" id="phoneInput" class="form-control" placeholder="09xxxxxxxxx" dir="ltr" inputmode="numeric" autocomplete="tel" maxlength="11" required></div>
<div class="form-group"><label for="passwordInput">گذرواژه</label><input type="password" id="passwordInput" class="form-control" placeholder="حداقل ۸ نویسه" autocomplete="current-password" minlength="8" maxlength="128" required></div>
<button type="submit" class="btn-submit" id="memberSubmit">ورود / ساخت حساب</button>
</form>

</section>
<section class="auth-step" data-step="2">
<div class="auth-hero"><div class="auth-hero__icon auth-hero__icon--success"><span>✓</span></div><h2 class="auth-title" id="welcomeTitle">خوش آمدی</h2><p class="auth-subtitle" id="welcomeSubtitle">ورود با موفقیت انجام شد</p></div>
<div class="auth-actions"><a href="profile.html" class="btn-submit">پروفایل من</a><a href="index.html" class="btn-text">بازگشت به خانه</a></div>
</section>
</main><nav class="bottom-nav"></nav></div><script src="js/main.js?v=5.60.0" defer></script><script src="js/auth.js?v=5.59.0" defer></script></body></html>
