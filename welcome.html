<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="به جمع بچه‌های حلقه شهید هادی ذوالفقاری خوش آمدی.">
  <title>خوش اومدی به حلقه 💙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/welcome.css">
</head>
<body class="welcome-body">
  <main class="welcome-page">
    <div class="welcome-glow welcome-glow--one" aria-hidden="true"></div>
    <div class="welcome-glow welcome-glow--two" aria-hidden="true"></div>
    <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

    <section class="welcome-card" aria-labelledby="welcomeTitle">
      <div class="welcome-check-wrap" aria-hidden="true">
        <div class="welcome-check-ring"><span class="welcome-check">✓</span></div>
        <span class="welcome-spark welcome-spark--one">✦</span>
        <span class="welcome-spark welcome-spark--two">✧</span>
        <span class="welcome-spark welcome-spark--three">✦</span>
      </div>
      <div class="welcome-eyebrow">حلقه شهید هادی ذوالفقاری</div>
      <h1 id="welcomeTitle">به جمع بچه‌های حلقه خوش اومدی 💙</h1>
      <p class="welcome-copy">از امروز تو هم یکی از بچه‌های حلقه‌ای. امیدواریم کنار هم رفاقت کنیم، یاد بگیریم و قدم‌های خوب برداریم.</p>
      <div class="welcome-divider" aria-hidden="true"><span></span><b>✦</b><span></span></div>
      <p class="welcome-small">خوشحالیم که اینجایی!</p>
      <div class="welcome-actions">
        <a class="welcome-primary" href="index.html">بریم به صفحه اصلی <span aria-hidden="true">←</span></a>
        <a class="welcome-secondary" href="profile.html">مشاهده پروفایل</a>
      </div>
      <button type="button" class="welcome-celebrate" id="celebrateAgain">دوباره جشن بگیریم ✨</button>
    </section>
    <p class="welcome-footer">رفاقت • رشد • کارهای خوب</p>
  </main>
  <script src="js/main.js?v=5.7.0" defer></script>
  <script src="js/welcome.js?v=1.0.0" defer></script>
</body>
</html>
