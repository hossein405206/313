plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hossein313.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hossein313.app'
        minSdk 23
        // Keep targetSdk at 34 so Android 15 does not force edge-to-edge
        // for this WebView app; this keeps content below the status bar.
        targetSdk 34
        // Increment versionCode for every installable APK update.
        versionCode 5
        versionName '1.1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
