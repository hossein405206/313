plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hossein313.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hossein313.app'
        minSdk 23
        // Keep targetSdk at 34 so Android 15 does not force edge-to-edge
        // for this WebView app; this keeps content below the status bar.
        targetSdk 34
        // Increment versionCode for every installable APK update.
        versionCode 6
        versionName '1.1.4'
    }

    signingConfigs {
        release {
            // The release key is provided through GitHub Actions secrets.
            // Never commit the keystore or passwords into the repository.
            def keystorePath = System.getenv('SIGNING_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                // PKCS12 keystores use the store password for the private key as well.
                keyPassword System.getenv('SIGNING_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
