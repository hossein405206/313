<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#146B66">
<title>پیشنهاد و انتقاد | حلقه شهید هادی ذوالفقاری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">
<header class="app-header">
<a href="index.html" class="header-back" aria-label="بازگشت">
<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
</a>
<h1>پیشنهاد و انتقاد</h1>
</header>

<main class="page">
<h2 class="section-title">نظر شما مهم است</h2>
<p class="section-subtitle">هر پیشنهاد یا انتقادی که دارید صادقانه بنویسید. پیام شما مستقیم به مسئولین می‌رسد.</p>

<form id="feedbackForm" novalidate>
<div class="form-group">
<label for="fbName">نام (اختیاری)</label>
<input type="text" id="fbName" class="form-control" placeholder="مثلاً محمد">
</div>

<div class="form-group">
<label for="fbPhone">شماره تماس (اختیاری)</label>
<input type="tel" id="fbPhone" class="form-control" placeholder="09xxxxxxxxx"
dir="ltr" inputmode="numeric" maxlength="11">
</div>

<div class="form-group">
<label for="fbCategory">موضوع</label>
<select id="fbCategory" class="form-control">
<option value="پیشنهاد">پیشنهاد</option>
<option value="انتقاد">انتقاد</option>
<option value="شکایت">شکایت</option>
<option value="سایر">سایر</option>
</select>
</div>

<div class="form-group">
<label for="fbMessage">متن پیام <span class="req">*</span></label>
<textarea id="fbMessage" class="form-control" placeholder="پیام خود را اینجا بنویسید..." required></textarea>
</div>

<button type="submit" class="btn-submit">ارسال پیام</button>
</form>
</main>

<nav class="bottom-nav" aria-label="ناوبری اصلی">
<a href="index.html" class="nav-item">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
<span>خانه</span>
</a>
<a href="activities.html" class="nav-item">
<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
<span>فعالیت‌ها</span>
</a>
<button type="button" class="nav-item" data-open-login>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
<span>ورود مربیان</span>
</button>
</nav>
</div>

<script src="js/main.js" defer></script>
</body>
</html>
