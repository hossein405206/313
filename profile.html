<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F6B62">
  <title>پروفایل من | کانون</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <div class="app-container">

    <header class="app-header">
      <a href="index.html" class="header-back" aria-label="بازگشت">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>
      <h1>پروفایل من</h1>
      <button type="button" class="header-logout" id="logoutBtn" aria-label="خروج">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </header>

    <main class="page profile-page">

      <!-- ═══ کارت هویت ═══ -->
      <section class="profile-hero">
        <div class="profile-avatar" id="profileAvatar">؟</div>
        <h2 class="profile-name" id="profileName">در حال بارگذاری...</h2>
        <p class="profile-phone" id="profilePhone" dir="ltr">—</p>
        <span class="profile-role-badge" id="profileRoleBadge">عضو کانون</span>
      </section>

      <!-- ═══ آمار ═══ -->
      <section class="profile-stats">
        <div class="pstat">
          <span class="pstat__num" id="statPoints">۰</span>
          <span class="pstat__label">امتیاز کل</span>
        </div>
        <div class="pstat">
          <span class="pstat__num" id="statCamps">۰</span>
          <span class="pstat__label">اردوها</span>
        </div>
        <div class="pstat">
          <span class="pstat__num" id="statDays">۰</span>
          <span class="pstat__label">روز عضویت</span>
        </div>
      </section>

      <!-- ═══ اطلاعات ═══ -->
      <section class="profile-info">
        <h3 class="section-title">اطلاعات من</h3>

        <div class="info-row">
          <div class="info-row__icon">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="info-row__content">
            <small>نام و نام خانوادگی</small>
            <strong id="infoFullName">—</strong>
          </div>
        </div>

        <div class="info-row">
          <div class="info-row__icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <div class="info-row__content">
            <small>کد ملی</small>
            <strong id="infoNationalCode" dir="ltr">—</strong>
          </div>
        </div>

        <div class="info-row">
          <div class="info-row__icon">
            <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="info-row__content">
            <small>تاریخ تولد</small>
            <strong id="infoBirthDate">—</strong>
          </div>
        </div>

        <div class="info-row">
          <div class="info-row__icon">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
          </div>
          <div class="info-row__content">
            <small>نام پدر</small>
            <strong id="infoFatherName">—</strong>
          </div>
        </div>

        <div class="info-row">
          <div class="info-row__icon">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </div>
          <div class="info-row__content">
            <small>شماره پدر</small>
            <strong id="infoFatherPhone" dir="ltr">—</strong>
          </div>
        </div>

        <div class="info-row">
          <div class="info-row__icon">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </div>
          <div class="info-row__content">
            <small>آدرس</small>
            <strong id="infoAddress">—</strong>
          </div>
        </div>

      </section>

      <!-- ═══ دکمه ویرایش ═══ -->
      <section class="profile-actions">
        <button type="button" class="btn-submit" id="editProfileBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          ویرایش اطلاعات
        </button>
        <button type="button" class="btn-text" id="logoutBtn2">
          خروج از حساب
        </button>
      </section>

    </main>

  </div>

  <!-- ═══ مدال ویرایش ═══ -->
  <div class="modal" id="editModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ویرایش اطلاعات</h3>
        <button type="button" class="close-btn" data-close-modal aria-label="بستن">&times;</button>
      </div>

      <form id="editForm" novalidate>

        <div class="form-group">
          <label for="editFirstName">نام</label>
          <input type="text" id="editFirstName" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="editLastName">نام خانوادگی</label>
          <input type="text" id="editLastName" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="editNationalCode">کد ملی</label>
          <input type="text" id="editNationalCode" class="form-control" dir="ltr" inputmode="numeric" maxlength="10">
        </div>

        <div class="form-group">
          <label for="editBirthDate">تاریخ تولد</label>
          <input type="text" id="editBirthDate" class="form-control" placeholder="1385/05/20" dir="ltr">
        </div>

        <div class="form-group">
          <label for="editFatherName">نام پدر</label>
          <input type="text" id="editFatherName" class="form-control">
        </div>

        <div class="form-group">
          <label for="editFatherPhone">شماره پدر</label>
          <input type="tel" id="editFatherPhone" class="form-control" dir="ltr" inputmode="numeric" maxlength="11">
        </div>

        <div class="form-group">
          <label for="editAddress">آدرس</label>
          <textarea id="editAddress" class="form-control" rows="2"></textarea>
        </div>

        <button type="submit" class="btn-submit" id="saveEditBtn">ذخیره تغییرات</button>

      </form>
    </div>
  </div>

  <script src="js/main.js" defer></script>
  <script src="js/profile.js" defer></script>
</body>
  </html>
