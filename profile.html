<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F6B62">
  <title>پروفایل من | مسجد امام رضا (ع)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css?v=2">
</head>
<body>

  <div class="app-container">

    <header class="app-header">
      <a href="index.html" class="header-back" aria-label="بازگشت">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>
      <h1>پروفایل من</h1>
      <button type="button" class="header-logout" id="logoutBtn" aria-label="خروج">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </header>

    <main class="page profile-page">

      <!-- ═══ کارت هویت ═══ -->
      <section class="profile-hero">
        <div class="profile-avatar" id="profileAvatar">؟</div>
        <button type="button" class="profile-photo-change" id="changeProfilePhoto">تغییر عکس پروفایل</button>
        <input type="file" id="profilePhotoInput" accept="image/jpeg,image/png,image/webp" hidden>
        <h2 class="profile-name" id="profileName">در حال بارگذاری...</h2>
        <p class="profile-phone" id="profilePhone" dir="ltr">—</p>
        <span class="profile-role-badge role-badge--unregistered" id="profileRoleBadge">عضویت تکمیل نشده</span>
      </section>

      <!-- ═══ آمار ═══ -->
      <section class="profile-stats">
        <div class="pstat">
          <span class="pstat__num" id="statPoints">۰</span>
          <span class="pstat__label">امتیاز کل</span>
        </div>
        <div class="pstat">
          <span class="pstat__num" id="statCamps">۰</span>
          <span class="pstat__label">اردوها</span>
        </div>
        <div class="pstat">
          <span class="pstat__num" id="statDays">۰</span>
          <span class="pstat__label">روز عضویت</span>
        </div>
        <div class="pstat pstat--record">
          <span class="pstat__num" id="statBestScore">۰</span>
          <span class="pstat__label">بیشترین رکورد تاریخ</span>
        </div>
      </section>

      <!-- ═══ اطلاعات ═══ -->
      <section class="profile-info">
        <h3 class="section-title">اطلاعات من</h3>

        <div class="info-row">
          <div class="info-row__icon">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="info-row__content">
            <small>نام و نام خانوادگی</small>
            <strong id="infoFullName">—</strong>
          </div>
        </div>

        <div class="info-row">
          <div class="info-row__icon">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="info-row__content">
            <small>نام نمایشی</small>
            <strong id="infoNickname">—</strong>
          </div>
        </div>






      </section>

      <!-- ═══ دکمه ویرایش ═══ -->
      <section class="profile-actions">
        <button type="button" class="btn-submit" id="editProfileBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          ویرایش اطلاعات
        </button>
        <button type="button" class="btn-text" id="logoutBtn2">
          خروج از حساب
        </button>
      </section>

    </main>

  </div>

  <!-- ═══ مدال ویرایش ═══ -->
  <div class="modal" id="editModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ویرایش اطلاعات</h3>
        <button type="button" class="close-btn" data-close-modal aria-label="بستن">&times;</button>
      </div>

      <form id="editForm" novalidate>

        <div class="form-group">
          <label for="editFirstName">نام</label>
          <input type="text" id="editFirstName" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="editLastName">نام خانوادگی</label>
          <input type="text" id="editLastName" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="editNickname">نام نمایشی در جدول رکوردها</label>
          <input type="text" id="editNickname" class="form-control" maxlength="24" required placeholder="مثلاً حسین">
          <small class="form-help">این نام را همه در جدول رکوردها می‌بینند</small>
        </div>

        <button type="submit" class="btn-submit" id="saveEditBtn">ذخیره تغییرات</button>

      </form>
    </div>
    <nav class="bottom-nav"></nav>
  </div>

  <script src="js/main.js" defer></script>
  <script src="js/profile.js" defer></script>
</body>
  </html>
