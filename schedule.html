<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14243b"><title>برنامه هفتگی | حلقه شهید هادی ذوالفقاری</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="app-container"><header class="app-header"><a href="index.html" class="header-back">←</a><div class="header-brand"><div><strong>مسجد امام رضا (ع)</strong><small>حلقه شهید هادی ذوالفقاری</small></div></div></header><main class="page schedule-page"><div class="section-heading"><div><span>WEEKLY PLAN</span><h2>برنامه هفتگی</h2></div></div><div id="scheduleList" class="schedule-list"><div class="event-loading"><span></span><p>در حال بارگذاری برنامه...</p></div></div></main><nav class="bottom-nav"></nav></div><script src="js/main.js" defer></script><script>
(function(){function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function dayIndex(day){return ['شنبه','یکشنبه','دوشنبه','سهشنبه','چهارشنبه','پنجشنبه','جمعه'].indexOf(String(day||'').replace(/\u200c/g,''))}function load(){var el=document.getElementById('scheduleList');if(!window.KanoonApp)return;window.KanoonApp.api.get({action:'listSchedule'}).then(function(r){var rows=r.items||[];rows.sort(function(a,b){var ai=dayIndex(a.day),bi=dayIndex(b.day);if(ai<0)ai=99;if(bi<0)bi=99;if(ai!==bi)return ai-bi;return String(a.createdAt||'').localeCompare(String(b.createdAt||''))||String(a.title||'').localeCompare(String(b.title||''),'fa')});el.innerHTML=rows.length?rows.map(function(x){return '<article class="schedule-card"><span class="schedule-day">'+esc(x.day||'')+'</span><div><h3>'+esc(x.title||'')+'</h3>'+(x.location?'<p>'+esc(x.location)+'</p>':'')+'</div></article>'}).join(''):'<div class="empty schedule-empty"><strong>برنامه‌ای برای این هفته ثبت نشده</strong><p>به محض ثبت برنامه جدید، همین‌جا نمایش داده می‌شود</p></div>'}).catch(function(){el.innerHTML='<div class="empty schedule-empty"><strong>برنامه‌ای برای این هفته ثبت نشده</strong></div>'})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load()})();
</script></body></html>
