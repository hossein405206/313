<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14243b"><title>برنامه هفتگی | حلقه شهید هادی ذوالفقاری</title>

(function(){function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function load(){var el=document.getElementById('scheduleList');if(!window.KanoonApp)return;window.KanoonApp.api.get({action:'listSchedule'}).then(function(r){var rows=r.items||[];el.innerHTML=rows.length?rows.map(function(x){return '<article class="schedule-card"><span class="schedule-day">'+esc(x.day||'')+'</span><div><h3>'+esc(x.title||'')+'</h3><p>'+esc(x.time||'')+(x.location?' · '+esc(x.location):'')+'</p></div></article>'}).join(''):'<div class="empty schedule-empty"><strong>برنامه‌ای برای این هفته ثبت نشده</strong><p>به محض ثبت برنامه جدید، همین‌جا نمایش داده می‌شود</p></div>'}).catch(function(){el.innerHTML='<div class="empty schedule-empty"><strong>برنامه‌ای برای این هفته ثبت نشده</strong></div>'})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load()})();
</script></body></html>
