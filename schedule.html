<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14243b"><title>برنامه هفتگی | حلقه شهید هادی ذوالفقاری</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=5.9.0"><style>
.schedule-filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin-bottom:8px;scrollbar-width:none}
.schedule-filters::-webkit-scrollbar{display:none}
.schedule-filter{flex:0 0 auto;border:1px solid #dce5ec;border-radius:999px;background:#fff;color:#607184;padding:9px 14px;font:800 .68rem Vazirmatn;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
.schedule-filter.is-active{background:linear-gradient(115deg,#0f766e,#2563eb);border-color:transparent;color:#fff;box-shadow:0 7px 16px rgba(37,99,235,.16)}
.schedule-card--ring{border-color:rgba(37,99,235,.14)}
.schedule-card--game{border-color:rgba(13,148,136,.2)}
.schedule-cat-ring{background:#dbeafe!important;color:#1d4ed8!important}
.schedule-cat-game{background:#ccfbf1!important;color:#0f766e!important}
</style></head><body><div class="app-container"><header class="app-header"><a href="index.html" class="header-back">←</a><div class="header-brand"><div><strong>مسجد امام رضا (ع)</strong><small>حلقه شهید هادی ذوالفقاری</small></div></div></header><main class="page schedule-page"><div class="section-heading"><div><span>WEEKLY PLAN</span><h2>برنامه هفتگی</h2></div></div><div class="schedule-filters" role="group" aria-label="فیلتر دسته برنامه"><button type="button" class="schedule-filter is-active" data-schedule-filter="همه">همه</button><button type="button" class="schedule-filter" data-schedule-filter="حلقه">برنامه‌های حلقه</button><button type="button" class="schedule-filter" data-schedule-filter="بازی">برنامه‌های بازی</button></div><div id="scheduleList" class="schedule-list"><div class="event-loading"><span></span><p>در حال بارگذاری برنامه...</p></div></div></main><nav class="bottom-nav"></nav></div><script src="js/main.js?v=5.11.0" defer></script><script>
(function(){
'use strict';
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dayIndex(day){return ['شنبه','یکشنبه','دوشنبه','سهشنبه','چهارشنبه','پنجشنبه','جمعه'].indexOf(String(day||'').replace(/\u200c/g,''))}
var allRows=[],filter='همه';
function render(){
 var el=document.getElementById('scheduleList');
 var rows=allRows.filter(function(x){return filter==='همه'||(String(x.category||'حلقه')==='بازی'?'بازی':'حلقه')===filter;});
 el.innerHTML=rows.length?rows.map(function(x){
  var cat=String(x.category||'حلقه')==='بازی'?'بازی':'حلقه',cls=cat==='حلقه'?'schedule-cat-ring':'schedule-cat-game';
  return '<article class="schedule-card '+(cat==='بازی'?'schedule-card--game':'schedule-card--ring')+'"><span class="schedule-day">'+esc(x.day||'')+'</span><div class="schedule-card-content"><span class="schedule-category '+cls+'">'+cat+'</span><h3>'+esc(x.title||'')+'</h3>'+(x.location?'<p>'+esc(x.location)+'</p>':'')+'</div></article>';
 }).join(''):'<div class="empty schedule-empty"><strong>'+(allRows.length?'در این دسته برنامه‌ای ثبت نشده':'برنامه‌ای برای این هفته ثبت نشده')+'</strong><p>'+(allRows.length?'دستهٔ دیگری را انتخاب کن تا برنامه‌های آن را ببینی.':'به محض ثبت برنامه جدید، همین‌جا نمایش داده می‌شود')+'</p></div>';
}
function load(){
 var el=document.getElementById('scheduleList');
 if(!window.KanoonApp||!window.KanoonApp.api){window.setTimeout(load,80);return;}
 window.KanoonApp.api.get({action:'listSchedule'}).then(function(r){
  allRows=(r.items||[]).slice().sort(function(a,b){var ai=dayIndex(a.day),bi=dayIndex(b.day);if(ai<0)ai=99;if(bi<0)bi=99;return ai-bi||String(a.createdAt||'').localeCompare(String(b.createdAt||''))||String(a.title||'').localeCompare(String(b.title||''),'fa')});
  render();
 }).catch(function(e){el.innerHTML='<div class="empty schedule-empty"><strong>دریافت برنامه ناموفق بود</strong><p>'+esc(e.message||'اتصال به سرور را بررسی کن')+'</p></div>'});
}
document.querySelectorAll('[data-schedule-filter]').forEach(function(button){
 button.addEventListener('click',function(){
  filter=button.getAttribute('data-schedule-filter')||'همه';
  document.querySelectorAll('[data-schedule-filter]').forEach(function(b){b.classList.toggle('is-active',b===button);b.setAttribute('aria-pressed',b===button?'true':'false')});
  render();
 });
});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load();
})();
</script></body></html>
