<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F6B62">
  <title>مسئولین | حلقه شهید هادی ذوالفقاری</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/officials.css">
</head>
<body>

  <div class="app-container">

    <header class="app-header">
      <a href="index.html" class="header-back" aria-label="بازگشت">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>
      <h1>مسئولین کانون</h1>
    </header>

    <main class="page">

      <section class="officials-stats" id="officialsStats">
        <div class="stat-box">
          <span class="stat-num" id="statTotal">۰</span>
          <span class="stat-label">مسئول</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="statOfficial">۰</span>
          <span class="stat-label">اجرایی</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="statSpecial">۰</span>
          <span class="stat-label">ویژه</span>
        </div>
      </section>

      <div class="chips" role="tablist" aria-label="فیلتر مسئولین">
        <button class="chip active" data-filter="all" role="tab">همه</button>
        <button class="chip" data-filter="official" role="tab">اجرایی</button>
        <button class="chip" data-filter="special" role="tab">ویژه</button>
      </div>

      <section class="officials-section" data-section="official">
        <h2 class="section-title">
          مسئولیت‌های اجرایی
          <small class="section-count" id="countOfficial">۰ نفر</small>
        </h2>
        <div class="officials-grid" id="officialsGridOfficial"></div>
      </section>

      <section class="officials-section" data-section="special">
        <h2 class="section-title section-title--gold">
          نقش‌های ویژه
          <small class="section-count" id="countSpecial">۰ نفر</small>
        </h2>
        <div class="officials-grid officials-grid--special" id="officialsGridSpecial"></div>
      </section>

      <div class="empty hidden" id="officialsEmpty">
        <p>مسئولی با این فیلتر پیدا نشد</p>
      </div>

      <div class="official-login-box">
        <h3>ورود مسئولین</h3>
        <p>اگه یکی از مسئولین کانون هستی، کد مسئولیتت رو وارد کن</p>
        <button type="button" class="btn-submit" id="openOfficialLogin">
          ورود با کد مسئولیت
        </button>
      </div>

    </main>

    <nav class="bottom-nav" aria-label="ناوبری اصلی">
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>خانه</span>
      </a>
      <a href="activities.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>فعالیت‌ها</span>
      </a>
      <button type="button" class="nav-item" data-open-login>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>ورود</span>
      </button>
    </nav>

  </div>

  <!-- مدال ورود مسئول -->
  <div class="modal" id="officialLoginModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ورود مسئولین</h3>
        <button type="button" class="close-btn" data-close-modal aria-label="بستن">&times;</button>
      </div>
      <form id="officialLoginForm" novalidate>
        <div class="form-group">
          <label for="officialCodeInput">کد مسئولیت:</label>
          <input
            type="text"
            id="officialCodeInput"
            class="form-control form-control--code"
            placeholder="ATT-2024"
            dir="ltr"
            autocomplete="off"
            required>
          <small class="form-hint">کد رو از مربی یا مالک کانون بگیر</small>
        </div>
        <button type="submit" class="btn-submit">ورود</button>
      </form>
    </div>
  </div>

  <script src="js/main.js" defer></script>
</body>
</html>
